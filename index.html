<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="/assets/images/favicon-32x32.png">
    <title>QR Code Component</title>
</head>
<body>
    <main>
        <article class="card">
            <header class="card_header">
                <img src="assets/images/image-qr-code.png" alt="QR Code" class="card_image">
            </header>
            <section class="card_main">
                <h1 class="card_title">Improve your front-end skills by building projects</h1>
                <p class="card_description">Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p>
            </section>
        </article>
    </main>
</body>
</html>
